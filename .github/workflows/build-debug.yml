name: Build Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 with build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-overwrite-existing: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          compile-sdk: 34
          build-tools-version: 34.0.0

      - name: Generate gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-debug-${{ github.run_number }}
          name: Debug build #${{ github.run_number }}
          body: |
            Auto-built on push to `${{ github.ref_name }}`.

            * commit: `${{ github.sha }}`
            * strips `com.eg.android.AlipayGphone` (支付宝) and `com.heytap.market` (应用市场) from the OPlus activity-start white list (src_pkg / dst_pkg / activity / user-set entries)
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
