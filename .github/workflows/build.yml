name: Build Debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10
          cache: all
          cache-dependency-path: |
            build.gradle.kts
            settings.gradle.kts
            app/build.gradle.kts
            gradle.properties

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10 --distribution-type bin

      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "keystore decoded"
          else
            echo "KEYSTORE_BASE64 not set, falling back to debug signing"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK to pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: debug-build
          name: Debug Build
          body: |
            每次 push 自动构建的 debug APK（更新同一个 pre-release）。
            模块: fuckcospm
            作用域: android (system_server)
            目标: 移除 com.heytap.market / com.nearme.instant.platform 被唤起时的白名单，强制弹窗询问
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
