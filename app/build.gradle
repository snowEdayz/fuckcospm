plugins {
    id "com.android.application"
}

android {
    namespace "io.github.colorospermissionwhitelisthook"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.colorospermissionwhitelisthook"
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_8
        targetCompatibility JavaVersion.VERSION_8
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
